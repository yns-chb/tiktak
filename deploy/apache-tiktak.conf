


<VirtualHost *:80>
    ServerName tiktak.yanischouhib.fr
</VirtualHost>

# Certificat obtenu avec : sudo certbot certonly --apache -d tiktak.yanischouhib.fr
<VirtualHost *:443>
    ServerName tiktak.yanischouhib.fr
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tiktak.yanischouhib.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tiktak.yanischouhib.fr/privkey.pem

    # 127.0.0.1 (et non localhost) : le port 3000 est pris par une autre application du serveur
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/
</VirtualHost>
